<?xml version="1.0" encoding="UTF-8"?>
<!--
  프로필 자리표시 이미지 (플레이스홀더)
  TODO(user): 실제 사진(jpg/png/webp)을 이 폴더에 넣고
  index.html 의 <img class="about__photo"> 의 src 와 alt 를 교체하세요.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="프로필 자리표시 이미지">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d5afe"/>
      <stop offset="100%" stop-color="#00a37a"/>
    </linearGradient>
  </defs>

  <rect width="360" height="360" rx="40" fill="url(#bg)"/>

  <!-- 어깨 -->
  <path d="M60 330c0-56 54-92 120-92s120 36 120 92z" fill="#ffffff" fill-opacity="0.92"/>
  <!-- 머리 -->
  <circle cx="180" cy="150" r="66" fill="#ffffff" fill-opacity="0.92"/>

  <text x="180" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.85">HJ</text>
</svg>
